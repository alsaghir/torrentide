name: CI

on:
  pull_request:
  push:
    branches: [main]
  # New advisories are published without any change to this repository.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Exactly what `nix flake check` runs locally: fmt, clippy, tests, nixfmt, rust-version,
  # and cargo-deny licences/bans/sources.
  flake-check:
    name: nix flake check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix flake check -L

  # Needs the advisory database from the network, which the Nix sandbox does not allow.
  advisories:
    name: cargo deny check advisories
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix develop --command cargo deny check advisories