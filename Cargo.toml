[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/alsaghir/torrentide"
readme = "README.md"
rust-version = "1.100"
# An application, not a library: no crate goes to crates.io.
publish = false

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
directories = "6"
# Default features pull `http-api-client` (unused) and `default-tls`, whose SHA-1 is `crypto-hash`
# → system OpenSSL on Linux. `rust-tls` uses aws-lc-rs for both tracker HTTPS and piece SHA-1:
# one crypto library, built from source, no system dependency.
librqbit = { version = "9", default-features = false, features = ["rust-tls"] }
serde = { version = "1", features = ["derive"] }
# `bundled` builds SQLite from source: one known version, no system library.
rusqlite = { version = "0.43", features = ["bundled"] }
# Already in the tree (via uuid); `thread_rng` gives `rand::random_range`.
rand = "0.10"
tempfile = "3"
torrentide-core = { path = "crates/torrentide-core" }
torrentide-engine-rqbit = { path = "crates/torrentide-engine-rqbit" }
thiserror = "2"
tokio = { version = "1", default-features = false }
# `preserve_order` writes sections in struct order, which reads better in a user-edited file.
toml = { version = "1", features = ["preserve_order"] }

[workspace.lints.rust]
# `deny` (not `forbid`) so a narrowly scoped `#[allow(unsafe_code)]` with a SAFETY
# comment stays possible where FFI is unavoidable.
unsafe_code = "deny"
# Lint set from the Microsoft Pragmatic Rust Guidelines (M-STATIC-VERIFICATION).
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
# Groups first (priority -1) so individual lints below can override them.
correctness = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Selected restriction lints.
allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"
if_then_some_else_none = "warn"
undocumented_unsafe_blocks = "warn"
unused_result_ok = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
too_long_first_doc_paragraph = "warn"
# Duplicate versions come from third-party trees (mostly Slint) we cannot unify;
# the duplicate policy belongs in cargo-deny instead.
multiple_crate_versions = "allow"
