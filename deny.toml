# cargo-deny policy: licences, security advisories, banned crates and sources.
# Run with `cargo deny check`. Reference: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true
# Only the platforms we ship (flake.nix `systems`), so crates for other targets are ignored.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[advisories]
# Vulnerabilities always fail. Unsound crates fail anywhere in the tree (default: direct
# dependencies only). Unmaintained crates fail only when we depend on them directly:
# for transitive ones we have no fix until the upstream crate moves on.
# Silence a specific advisory only via `ignore = [{ id = "...", reason = "..." }]`.
unsound = "all"
unmaintained = "workspace"
yanked = "deny"

[licenses]
# Every licence here must be compatible with Torrentide's licensing: MPL-2.0 source, GPL-3.0 GUI binary.
# For `A OR B` expressions only one alternative needs to be allowed.
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    # Slint is used under its GPL-3.0 option, so the GUI binary is distributed under GPL-3.0.
    # Torrentide's source stays MPL-2.0, compatible via the Secondary License clause (LICENSE §3.3).
    "GPL-3.0-only",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# The list is policy, not inventory: most entries match no dependency yet.
unused-allowed-license = "allow"
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies have no version requirement; that is not a wildcard risk.
allow-wildcard-paths = true
# Architecture rules. `wrappers` lists the only crates allowed to depend on
# the banned crate directly, so the rules also hold transitively. Each rule is added together
# with the crate it constrains.
deny = [
    { crate = "librqbit", wrappers = ["torrentide-engine-rqbit", "torrentide-testkit"], reason = "only the engine adapter uses librqbit, and the testkit for test peers; everything else goes through torrentide-core's Engine trait" },
    { crate = "rusqlite", wrappers = ["torrentide-core"], reason = "one crate owns the database; everything else goes through its API" },
    { crate = "torrentide-engine-rqbit", wrappers = ["torrentide", "torrentide-cli"], reason = "only composition roots choose the engine; the GUI and core talk to torrentide-core" },
    { crate = "torrentide-gui", wrappers = ["torrentide"], reason = "only the desktop composition root uses the GUI crate" },
    { crate = "slint", wrappers = ["torrentide-gui"], reason = "the UI toolkit stays inside the GUI crate" },
    { crate = "slint-build", wrappers = ["torrentide-gui"], reason = "the UI toolkit stays inside the GUI crate" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"